version: '3.8'

services:
  backend:
    build:
      context: ./TourMateBE
      dockerfile: Dockerfile
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  remove_membership_worker:
    build:
      context: ./TourMateBE
      dockerfile: RemoveMembership/Dockerfile
    depends_on:
      - backend
      
  frontend:
    build:
      context: ./tourmatefe
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
      - NODE_ENV=development
    depends_on:
      - backend
